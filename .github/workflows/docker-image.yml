name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # push to Docker Hub only when the DOCKER_USERNAME / DOCKER_PASSWORD secrets are set
      CAN_PUSH: ${{ github.event_name == 'push' && secrets.DOCKER_USERNAME != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build Lab10Deployment.sln -c Release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./MyAspNetCoreApp
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ${{ secrets.DOCKER_USERNAME || 'local' }}/myaspnetcoreapp:latest
